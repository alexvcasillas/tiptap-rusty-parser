[package]
name = "tiptap-rusty-markdown"
version = "0.1.1"
edition = "2021"
description = "Fast Markdown <-> Tiptap/ProseMirror JSONContent conversion on top of tiptap-rusty-parser"
license = "MIT"
repository = "https://github.com/alexvcasillas/tiptap-studio"
homepage = "https://tiptap-studio.alexvcasillas.dev/docs/markdown"
documentation = "https://docs.rs/tiptap-rusty-markdown"
keywords = ["tiptap", "prosemirror", "markdown", "commonmark", "gfm"]
categories = ["parsing", "text-processing"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
tiptap-rusty-parser = { version = "0.6.1", path = "../parser" }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench"
harness = false
