# Tiptap Studio release builds: Windows x86_64 (.zip) and Linux x86_64 (.tar.gz), both unsigned.
# macOS is built, signed and notarized locally (studio/packaging/macos/release.sh); that script
# pushes the `studio-vX.Y.Z` tag, which runs this workflow and adds these archives to the same
# draft GitHub Release. Manual runs (workflow_dispatch) build and upload artifacts only.
# Docs: studio/packaging/README.md.
name: studio release

on:
  workflow_dispatch:
  push:
    tags: ["studio-v*"]

permissions:
  contents: read

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Read version, check tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="$(studio/packaging/macos/bundle.sh version)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "studio-v$v" ]; then
            echo "::error::tag $REF_NAME does not match studio/Cargo.toml version $v (expected studio-v$v)"
            exit 1
          fi
          echo "Tiptap Studio $v" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x86_64
    needs: version
    runs-on: windows-2022 # MSVC + Windows SDK (gpui needs fxc.exe for HLSL shaders)
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: studio-windows-x86_64
      - name: Build
        run: cargo build --release --locked -p tiptap-rusty-studio --target x86_64-pc-windows-msvc
      - name: Package .zip
        shell: pwsh
        run: |
          $name = "TiptapStudio-$env:VERSION-windows-x86_64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/tiptap-studio.exe $dir
          Copy-Item studio/packaging/README.dist.txt "$dir/README.txt"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip" -Force
          "### Windows x86_64`n- zip: ``$name.zip`` (unsigned exe)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiptap-studio-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-22.04 # older glibc → runs on more distros
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libx11-xcb-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            xvfb mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: studio-linux-x86_64
      - name: Build
        run: cargo build --release --locked -p tiptap-rusty-studio
      - name: Headless smoke run (10 s, no panic)
        run: |
          set +e
          xvfb-run -a timeout 10 target/release/tiptap-studio > smoke.log 2>&1
          rc=$?
          set -e
          cat smoke.log
          if grep -q panicked smoke.log; then echo "::error::tiptap-studio panicked"; exit 1; fi
          if [ "$rc" -ne 124 ]; then echo "::error::tiptap-studio exited early (rc=$rc)"; exit 1; fi
      - name: Package .tar.gz
        run: |
          out="$(studio/packaging/linux/package.sh target/release/tiptap-studio dist "$VERSION")"
          printf '### Linux x86_64\n- tar.gz: \x60%s\x60\n' "$(basename "$out")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiptap-studio-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: studio/packaging/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tiptap-studio-*
          path: dist
          merge-multiple: true
      - name: Checksums (one .sha256 per file, same as the macOS script)
        run: |
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
      # Adds to the draft release.sh created, or creates it when the tag was pushed by hand.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          name: Tiptap Studio ${{ needs.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: studio/packaging/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
