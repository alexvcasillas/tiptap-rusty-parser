name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p tiptap-rusty-parser --all-targets -- -D warnings

      - name: Test
        run: cargo test -p tiptap-rusty-parser --all-targets

      - name: Doctests
        run: cargo test --doc -p tiptap-rusty-parser

  wasm:
    name: wasm build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Clippy (wasm)
        run: cargo clippy -p tiptap-rusty-parser-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Build (bundler)
        run: wasm-pack build bindings/wasm --target bundler

      - name: Test (node)
        run: wasm-pack test --node bindings/wasm
