name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC)

# Don't overlap release runs.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish any crate whose version in Cargo.toml isn't yet on crates.io.
  # In practice this only fires after a Release PR (below) is merged.
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run release-plz
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Publish the WASM bindings to npm when a crate release was just cut.
      # Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN, with provenance.
      - name: Install wasm-pack
        if: steps.release.outputs.releases_created == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
      - name: Build WASM package
        if: steps.release.outputs.releases_created == 'true'
        run: wasm-pack build bindings/wasm --target bundler --release
      - name: Prepare npm package
        if: steps.release.outputs.releases_created == 'true'
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='tiptap-rusty-parser'))")
          cp LICENSE bindings/wasm/pkg/ 2>/dev/null || true
          cp bindings/wasm/README.md bindings/wasm/pkg/ 2>/dev/null || true
          node -e "const f='bindings/wasm/pkg/package.json',p=require('./'+f);p.name='tiptap-rusty-parser';p.version='$VERSION';p.license='MIT';p.description='Fast WASM parser/manipulator for Tiptap/ProseMirror JSONContent';p.repository={type:'git',url:'https://github.com/alexvcasillas/tiptap-rusty-parser'};require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - uses: actions/setup-node@v4
        if: steps.release.outputs.releases_created == 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish to npm (OIDC)
        if: steps.release.outputs.releases_created == 'true'
        run: |
          npm install -g npm@latest # npm >= 11.5.1 for Trusted Publishing
          npm publish --provenance --access public
        working-directory: bindings/wasm/pkg

  # Open/refresh a "Release PR" that bumps the version + updates the
  # changelog from conventional commits since the last release.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
