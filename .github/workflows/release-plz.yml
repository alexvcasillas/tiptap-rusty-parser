name: Release-plz

on:
  push:
    branches: [main]
  # Manual: publish the npm package at the current crate version only (no
  # release-plz run). For when the crate published but the npm step failed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # crates.io + npm Trusted Publishing (OIDC)
  actions: write # dispatch studio-release.yml

# Don't overlap release runs.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish any crate whose version in Cargo.toml isn't yet on crates.io, via
  # crates.io Trusted Publishing (OIDC): no CARGO_REGISTRY_TOKEN secret.
  # In practice this only fires after a Release PR (below) is merged.
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run release-plz
        id: release
        if: github.event_name == 'push'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Which packages were released: the crate drives npm, the studio drives the
      # desktop builds. (`releases_created` alone is true for a studio-only release.)
      - name: Inspect releases
        id: which
        if: github.event_name == 'push' && steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          echo "$RELEASES" | jq .
          parser="$(echo "$RELEASES" | jq -r 'any(.[]; .package_name == "tiptap-rusty-parser")')"
          studio_tag="$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "tiptap-rusty-studio") | .tag')"
          echo "parser=$parser" >> "$GITHUB_OUTPUT"
          echo "studio_tag=$studio_tag" >> "$GITHUB_OUTPUT"
      - name: Build desktop apps for the studio release
        if: steps.which.outputs.studio_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.which.outputs.studio_tag }}
        run: gh workflow run studio-release.yml --ref "$TAG"

      - name: Decide on npm
        id: npm
        run: echo "publish=${{ github.event_name == 'workflow_dispatch' || steps.which.outputs.parser == 'true' }}" >> "$GITHUB_OUTPUT"

      # Publish the WASM bindings to npm when a crate release was just cut, or
      # on a manual dispatch (republish at the crate's current version).
      # Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN, with provenance.
      - name: Install wasm-pack
        if: steps.npm.outputs.publish == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
      - name: Build WASM package
        if: steps.npm.outputs.publish == 'true'
        run: wasm-pack build bindings/wasm --target bundler --release
      - name: Prepare npm package
        if: steps.npm.outputs.publish == 'true'
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='tiptap-rusty-parser'))")
          cp LICENSE bindings/wasm/pkg/ 2>/dev/null || true
          cp bindings/wasm/README.md bindings/wasm/pkg/ 2>/dev/null || true
          node -e "const f='bindings/wasm/pkg/package.json',p=require('./'+f);p.name='@tiptap-studio/rusty-parser';p.version='$VERSION';p.license='MIT';p.description='Fast WASM parser/manipulator for Tiptap/ProseMirror JSONContent';p.repository={type:'git',url:'https://github.com/alexvcasillas/tiptap-studio'};require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - uses: actions/setup-node@v4
        if: steps.npm.outputs.publish == 'true'
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish to npm (OIDC)
        if: steps.npm.outputs.publish == 'true'
        run: |
          npm install -g npm@11.5.1 # pinned; Trusted Publishing needs npm >= 11.5.1
          npm publish --provenance --access public
        working-directory: bindings/wasm/pkg

  # Open/refresh a "Release PR" that bumps the version + updates the
  # changelog from conventional commits since the last release.
  release-pr:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
