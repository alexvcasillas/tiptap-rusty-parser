name: studio (macOS build)

on:
  workflow_dispatch:
  push:
    branches: [feat/gpui-studio]
    paths: ["studio/**", ".github/workflows/studio-mac.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build tiptap-studio (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: studio-mac
      - name: Build
        run: cargo build --release -p tiptap-rusty-studio
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/tiptap-studio dist/
          cp studio/assets/sample.json dist/
          printf '%s\n' '# tiptap-studio (macOS arm64, unsigned)' '' 'xattr -d com.apple.quarantine ./tiptap-studio' './tiptap-studio            # bundled sample' './tiptap-studio doc.json   # open a file' > dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tiptap-studio-macos-arm64
          path: dist/
          retention-days: 14
