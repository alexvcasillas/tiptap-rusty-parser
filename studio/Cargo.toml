[package]
name = "tiptap-rusty-studio"
version = "0.3.0"
edition = "2021"
publish = false
description = "GPUI desktop inspector, structural editor and differ for Tiptap/ProseMirror JSON"
license = "MIT"
repository = "https://github.com/alexvcasillas/tiptap-studio"
homepage = "https://github.com/alexvcasillas/tiptap-studio/tree/main/studio"
readme = "README.md"
# Release packaging (macOS .app/.dmg, Windows .zip, Linux .tar.gz) reads `version`
# from here: studio/packaging/README.md. Bump it, then tag `studio-v<version>`.

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1" # embeds packaging/icon/icon.ico into the .exe (build.rs)

[[bin]]
name = "tiptap-studio"
path = "src/main.rs"

[dependencies]
tiptap-rusty-parser = { path = "../parser" }
gpui-kit = "0.8.0"
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
# Document Server browser (cloud/): GET-only HTTPS client, OS keychain, zeroized tokens.
ureq = { version = "3", features = ["platform-verifier"] }
keyring = "4"
zeroize = "1"
