[package]
name = "tiptap-rusty-studio"
version = "0.1.0"
edition = "2021"
publish = false
description = "GPUI desktop inspector, structural editor and differ for Tiptap/ProseMirror JSON"
license = "MIT"

[[bin]]
name = "tiptap-studio"
path = "src/main.rs"

[dependencies]
tiptap-rusty-parser = { path = ".." }
gpui-kit = "0.8.0"
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
