# The WASM bindings crate is published to npm (not crates.io) via the
# release-plz.yml `release` job, so release-plz ignores it entirely.
# `publish = false` must mirror the crate's Cargo.toml or release-plz aborts.
#
# NOTE — keeping crate and npm versions in sync: the npm package is built and
# published *only* when a `tiptap-rusty-parser` (crate) release is cut, and its
# version is read from the crate's version. So a change that only touches
# `bindings/wasm/**` will NOT reach npm on its own. When you land a WASM-only
# change, pair it with a patch bump of the main crate (a "paired release", even
# if the Rust library is unchanged) so the new bindings publish and the crate
# and npm versions stay matched. See the v0.3.7 entry in CHANGELOG.md.
# Pinned: with two released packages release-plz would default to
# `{{ package }}-v{{ version }}`, which is what happened to v0.5.0.
[[package]]
name = "tiptap-rusty-parser"
changelog_path = "parser/CHANGELOG.md"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# Markdown <-> JSONContent, published to crates.io with its own tag.
[[package]]
name = "tiptap-rusty-markdown"
changelog_path = "markdown/CHANGELOG.md"
git_tag_name = "markdown-v{{ version }}"
git_release_name = "tiptap-rusty-markdown {{ version }}"

[[package]]
name = "tiptap-rusty-parser-wasm"
release = false
publish = false

# Compiles the docs site's Rust examples as doctests; never released.
[[package]]
name = "docs-check"
release = false
publish = false

# The GPUI desktop app: versioned and tagged by release-plz (never on crates.io).
# It depends on the parser by path, so a parser bump also bumps the studio. The
# `studio-v*` tag is what studio-release.yml builds; release-plz.yml dispatches
# that workflow after the release (a tag made with GITHUB_TOKEN triggers nothing
# by itself). release-plz opens the GitHub Release as a draft with the changelog
# as body; studio-release.yml attaches the binaries and publishes it.
[[package]]
name = "tiptap-rusty-studio"
release = true
publish = false
git_only = true # not on crates.io: current version comes from the studio-v* tags
git_tag_name = "studio-v{{ version }}"
git_release_name = "Tiptap Studio {{ version }}"
git_release_draft = true
git_release_latest = false
changelog_path = "studio/CHANGELOG.md"
features_always_increment_minor = true
